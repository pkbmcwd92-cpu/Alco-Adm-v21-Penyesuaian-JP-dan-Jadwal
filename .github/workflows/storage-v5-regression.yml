name: Storage V5 Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [storage, planning, documents, transport]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run all tests in group (aggregate failures)
        run: npm run ci:tests -- ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ matrix.group }}
          path: artifacts/ci/
  typecheck:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
  build-and-production:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx tsx scripts/testProductionServerSmoke.ts
